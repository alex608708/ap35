name: Build AP35AgentTray

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Tray EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "AP35AgentTray" `
            --hidden-import "pystray._win32" `
            --hidden-import "PIL._imaging" `
            --hidden-import "updater" `
            --hidden-import "installer" `
            --hidden-import "win32timezone" `
            main.py

      - name: Build Service EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --console `
            --name "AP35AgentService" `
            --hidden-import "win32timezone" `
            --hidden-import "servicemanager" `
            --hidden-import "win32service" `
            --hidden-import "win32serviceutil" `
            --hidden-import "win32event" `
            service.py

      - name: Upload to server
        shell: pwsh
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }

          $form = @{ token = $env:UPLOAD_TOKEN; file = Get-Item "dist\AP35AgentTray.exe" }
          $resp = Invoke-RestMethod -Uri "$env:SERVER_URL/admin/upload_tray" `
                                    -Method Post `
                                    -Form $form `
                                    -TimeoutSec 120
          if ($resp.ok) {
            Write-Host "Tray uploaded: $($resp.size) bytes"
          } else {
            Write-Error "Server error: $($resp | ConvertTo-Json)"
            exit 1
          }

          $form2 = @{ token = $env:UPLOAD_TOKEN; file = Get-Item "dist\AP35AgentService.exe" }
          $resp2 = Invoke-RestMethod -Uri "$env:SERVER_URL/admin/upload_service" `
                                     -Method Post `
                                     -Form $form2 `
                                     -TimeoutSec 120
          if ($resp2.ok) {
            Write-Host "Service uploaded: $($resp2.size) bytes"
          } else {
            Write-Host "Service upload warning: $($resp2 | ConvertTo-Json)"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AP35Agent
          path: |
            dist/AP35AgentTray.exe
            dist/AP35AgentService.exe
          retention-days: 30
