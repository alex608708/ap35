name: Build AP35AgentTray

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build Tray EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --windowed `
            --name "AP35AgentTray" `
            --hidden-import "pystray._win32" `
            --hidden-import "PIL._imaging" `
            --hidden-import "updater" `
            --hidden-import "installer" `
            --hidden-import "win32timezone" `
            main.py

      - name: Build Service EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --console `
            --name "AP35AgentService" `
            --hidden-import "win32timezone" `
            --hidden-import "servicemanager" `
            --hidden-import "win32service" `
            --hidden-import "win32serviceutil" `
            --hidden-import "win32event" `
            service.py

      - name: Upload to server
        continue-on-error: true
        shell: pwsh
        env:
          UPLOAD_TOKEN: ${{ secrets.UPLOAD_TOKEN }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
        run: |
          [System.Net.ServicePointManager]::ServerCertificateValidationCallback = { $true }

          $form = @{ token = $env:UPLOAD_TOKEN; file = Get-Item "dist\AP35AgentTray.exe" }
          try {
            $resp = Invoke-RestMethod -Uri "$env:SERVER_URL/admin/upload_tray" `
                                      -Method Post -Form $form -TimeoutSec 120
            if ($resp.ok) { Write-Host "Tray uploaded: $($resp.size) bytes" }
            else { Write-Warning "Tray upload: $($resp | ConvertTo-Json)" }
          } catch { Write-Warning "Upload tray failed: $_" }

          $form2 = @{ token = $env:UPLOAD_TOKEN; file = Get-Item "dist\AP35AgentService.exe" }
          try {
            $resp2 = Invoke-RestMethod -Uri "$env:SERVER_URL/admin/upload_service" `
                                       -Method Post -Form $form2 -TimeoutSec 120
            if ($resp2.ok) { Write-Host "Service uploaded: $($resp2.size) bytes" }
            else { Write-Warning "Service upload: $($resp2 | ConvertTo-Json)" }
          } catch { Write-Warning "Upload service failed: $_" }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AP35Agent
          path: |
            dist/AP35AgentTray.exe
            dist/AP35AgentService.exe
          retention-days: 30
